name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hppku
          POSTGRES_PASSWORD: hppku
          POSTGRES_DB: hppku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hppku"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://hppku:hppku@localhost:5432/hppku?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: receipts
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      # services: can't pass a command, so start S3 (SeaweedFS) by hand
      - name: Start S3
        run: |
          docker run -d -p 8333:8333 chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8333/ && break; sleep 2; done
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy --config prisma7.config.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm audit --prod --audit-level critical

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node node_modules/@typescript/native/bin/tsc --noEmit
      - run: pnpm build
