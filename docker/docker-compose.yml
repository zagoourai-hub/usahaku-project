# Run from repo root.
#   Infra only (dev):   docker compose -f docker/docker-compose.yml up -d   (postgres, redis, s3)
#   Full stack images:  JWT_SECRET=... docker compose -f docker/docker-compose.yml --profile app up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hppku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hppku}
      POSTGRES_DB: ${POSTGRES_DB:-hppku}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for receipt photos (Apache-2.0).
  # Dev only: no identities configured = open S3 API on localhost.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data

  backend:
    profiles: [app]
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hppku}:${POSTGRES_PASSWORD:-hppku}@postgres:5432/${POSTGRES_DB:-hppku}?schema=public
      JWT_SECRET: ${JWT_SECRET:-} # app refuses to boot if < 32 chars
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: receipts
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started

  frontend:
    profiles: [app]
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        # Browser-facing backend URL, baked in at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  s3data:
